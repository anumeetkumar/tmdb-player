<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidNest Embed Player</title>
  <link rel="stylesheet" href="playground_style.css">
  <!-- Load HLS.js for HLS streaming support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0/dist/hls.min.js"></script>
  <style>
    .custom-subtitles {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: center;
    }
    .subtitle-cue {
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 8px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.15rem;
      font-weight: 500;
      text-align: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      word-wrap: break-word;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.5px;
      line-height: 1.4;
      animation: fadeInSub 0.15s ease-out;
    }
    @keyframes fadeInSub {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="embed-player-body">

  <div class="player-wrapper" id="playerWrapper">
    <!-- Main HTML5 Video Element -->
    <video id="mainVideo" playsinline crossorigin="anonymous" poster="https://image.tmdb.org/t/p/w1280/nMl7h2ZYE2nMfQWLgsh09Zaqarj.jpg">
      <!-- Tracks will be dynamically injected by JavaScript -->
    </video>

    <!-- Centered Play/Pause Overlay Animation -->
    <div class="player-overlay" id="playPauseOverlay">
      <svg id="overlayIcon" width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </div>

    <!-- Buffering/Loading Spinner -->
    <div class="buffering-spinner" id="bufferingSpinner">
      <div class="spinner-icon"></div>
    </div>

    <!-- Custom Subtitles Floating Overlay -->
    <div class="custom-subtitles" id="subtitlesOverlay">
      <div class="subtitle-cue" id="subtitleCue" style="display: none;"></div>
    </div>

    <!-- Skip Intro Button Overlay -->
    <button class="skip-intro-btn" id="skipIntroBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 4 15 12 5 20 5 4"></polygon>
        <line x1="19" y1="5" x2="19" y2="19"></line>
      </svg>
      Skip Intro
    </button>

    <!-- Custom Control HUD Overlay -->
    <div class="custom-controls" id="customControls">
      
      <!-- Video Timeline Seekbar -->
      <div class="seekbar-container" id="seekbarContainer">
        <div class="seekbar-buffer" id="seekbarBuffer"></div>
        <div class="seekbar-progress" id="seekbarProgress"></div>
        <div class="seekbar-handle" id="seekbarHandle"></div>
        <div class="seekbar-tooltip" id="seekbarTooltip">00:00</div>
      </div>

      <!-- Control Buttons & Settings Row -->
      <div class="control-bar">
        
        <!-- Left Group (Play, Volume, Time) -->
        <div class="control-left">
          
          <!-- Play / Pause toggle -->
          <button class="control-btn" id="playBtn" aria-label="Play">
            <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <!-- Volume Controls -->
          <div class="volume-container">
            <button class="control-btn" id="muteBtn" aria-label="Mute">
              <svg id="volumeIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
              </svg>
            </button>
            <div class="volume-slider-container" id="volumeSliderContainer">
              <div class="volume-progress" id="volumeProgress"></div>
            </div>
          </div>

          <!-- Time Indicators -->
          <div class="time-display">
            <span id="currentTime">00:00</span>
            <span class="time-divider">/</span>
            <span id="durationTime">00:00</span>
          </div>

        </div>

        <!-- Right Group (Servers, Subtitles, Settings, Fullscreen) -->
        <div class="control-right">
          
          <!-- Next Episode Button -->
          <button class="control-btn" id="nextEpisodeBtn" aria-label="Next Episode" style="display: none; color: var(--accent-cyan);" title="Next Episode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19"></line>
            </svg>
          </button>

          <!-- Server Selection Menu -->
          <div class="player-dropdown" id="serverDropdown">
            <button class="control-btn" id="serverMenuBtn" aria-label="Server Selection">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                <line x1="6" y1="6" x2="6.01" y2="6"></line>
                <line x1="6" y1="18" x2="6.01" y2="18"></line>
              </svg>
            </button>
            <div class="dropdown-menu" id="serverMenu" role="menu">
              <!-- Dynamically populated servers -->
            </div>
          </div>

          <!-- Subtitles/Captions Selector -->
          <div class="player-dropdown" id="subDropdown">
            <button class="control-btn" id="subMenuBtn" aria-label="Subtitles">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <path d="M7 15h4M13 15h4M7 9h10"></path>
              </svg>
            </button>
            <div class="dropdown-menu" id="subMenu" role="menu">
              <!-- Dynamically populated subtitles -->
            </div>
          </div>

          <!-- Quality Selector (HLS levels only) -->
          <div class="player-dropdown" id="qualityDropdown" style="display:none">
            <button class="control-btn" id="qualityMenuBtn" aria-label="Quality" title="Quality">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="10" rx="2" ry="2"></rect>
                <path d="M17 7V5a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v2"></path>
                <line x1="12" y1="12" x2="12" y2="12"></line>
              </svg>
            </button>
            <div class="dropdown-menu" id="qualityMenu" role="menu">
              <!-- Dynamically populated HLS quality levels -->
            </div>
          </div>

          <!-- Settings Dropdown (Speed, Auto Play, Skip Intro) -->
          <div class="player-dropdown" id="settingsDropdown">
            <button class="control-btn" id="settingsMenuBtn" aria-label="Settings">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
            <div class="dropdown-menu" id="settingsMenu" role="menu">
              <!-- Playback Speed -->
              <div class="dropdown-item" id="speedOption">
                <span>Playback Speed</span>
                <span id="speedValue" style="color: var(--accent-cyan)">1.0x</span>
              </div>
              <!-- Skip Intro Switch -->
              <div class="dropdown-item" id="skipIntroToggle">
                <span>Skip Intro Banner</span>
                <span id="skipIntroState" style="color: var(--success)">On</span>
              </div>
              <!-- Auto Play Switch -->
              <div class="dropdown-item" id="autoPlayToggle">
                <span>Autoplay Next</span>
                <span id="autoPlayState" style="color: var(--text-dark)">Off</span>
              </div>
            </div>
          </div>

          <!-- Fullscreen Button -->
          <button class="control-btn" id="fullscreenBtn" aria-label="Fullscreen">
            <svg id="fullscreenIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
          </button>

        </div>

      </div>

    </div>

  </div>

  <!-- Main player script -->
  <script src="player.js?v=2.2"></script>
</body>
</html>
